<app-interactive-backdrop />

<div class="page-enter min-h-screen text-white relative overflow-x-hidden flex flex-col font-space-grotesk">
  <!-- Navigation -->
  <nav class="shrink-0 w-full max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 py-4 sm:py-5">
    <a routerLink="/" class="flex items-center hover:opacity-80 transition-opacity duration-300" aria-label="Alex Kariuki home">
      <span class="text-xl sm:text-2xl font-bold mr-1.5 text-teal-400">&#123;</span>
      <span class="text-base sm:text-lg font-bold tracking-wide">ALEX KARIUKI</span>
      <span class="text-xl sm:text-2xl font-bold ml-1.5 text-teal-400">&#125;</span>
    </a>
    <div class="flex space-x-5 sm:space-x-8 text-sm sm:text-base">
      <a routerLink="/projects" class="text-teal-400 hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Projects</a>
      <a href="https://medium.com/@alex1kariuki" target="_blank" rel="noopener noreferrer" class="text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Blog</a>
      <a routerLink="/contact" class="text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Contact</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    <h1 class="text-2xl sm:text-3xl font-light text-center mb-5 tracking-wide font-display">Projects</h1>

    <!-- Category Tabs -->
    <div class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-8">
      <button
        *ngFor="let cat of categories"
        type="button"
        (click)="filterProjects(cat)"
        class="px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 hover:bg-teal-500/30 hover:text-teal-200 category-tab"
        [ngClass]="{
          'bg-teal-500/20 text-teal-300 active': isCategorySelected(cat),
          'bg-white/5 text-gray-300': !isCategorySelected(cat)
        }"
      >
        {{ cat }}
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 category-fade-in">
      <article
        *ngFor="let project of projects; let i = index"
        class="group flex flex-col bg-white/[0.03] border border-white/10 rounded-xl overflow-hidden shadow-lg hover:border-teal-500/40 hover:shadow-teal-500/10 transition-all duration-300 project-card animate-fade-in"
        [style.animation-delay]="i * 80 + 'ms'"
      >
        <!-- Image -->
        <div class="relative overflow-hidden h-40">
          <img
            [src]="project.image"
            [alt]="project.title + ' preview'"
            (error)="onImageError($event)"
            loading="lazy"
            class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-110"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-[#05010f]/80 to-transparent"></div>
          <div class="absolute top-3 left-3 flex flex-wrap gap-1.5">
            <span *ngFor="let cat of project.categories" class="px-2 py-0.5 text-[11px] rounded-md bg-black/50 backdrop-blur-sm text-white font-medium">
              {{ cat }}
            </span>
          </div>
        </div>

        <!-- Body -->
        <div class="flex flex-col flex-1 p-5">
          <h2 class="text-lg font-semibold mb-2 text-teal-400">{{ project.title }}</h2>
          <p class="text-gray-300 text-sm mb-4 line-clamp-3">{{ project.description }}</p>
          <div class="flex flex-wrap gap-1.5 mt-auto">
            <span *ngFor="let tech of project.technologies" [class]="getTechBgClass(tech.color) + ' px-2.5 py-0.5 text-[11px] rounded-full tech-tag'">
              {{ tech.name }}
            </span>
          </div>
        </div>
      </article>
    </div>

    <!-- Empty State -->
    <div *ngIf="projects.length === 0" class="text-center py-16 category-fade-in">
      <p class="text-gray-400 text-lg">No projects found in this category.</p>
      <button
        type="button"
        (click)="filterProjects('All')"
        class="mt-4 px-6 py-2 bg-teal-500/20 text-teal-300 rounded-full hover:bg-teal-500/30 transition-colors duration-300"
      >
        Show All Projects
      </button>
    </div>
  </main>
</div>
