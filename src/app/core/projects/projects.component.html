<app-interactive-backdrop />

<div class="page-enter min-h-screen text-white relative overflow-x-hidden flex flex-col font-space-grotesk">
  <!-- Navigation -->
  <nav class="p-4 sm:p-6 lg:p-8">
    <div class="max-w-7xl mx-auto flex flex-col items-center space-y-4 sm:space-y-6">
      <a routerLink="/" class="relative flex items-center hover:opacity-80 transition-opacity duration-300" aria-label="Alex Kariuki home">
        <span class="text-2xl sm:text-3xl font-bold mr-2 sm:mr-3">&#123;</span>
        <div class="flex flex-col items-center leading-none">
          <span class="text-xl sm:text-2xl font-bold mb-1">ALEX</span>
          <span class="text-xl sm:text-2xl font-bold">KARIUKI</span>
        </div>
        <span class="text-2xl sm:text-3xl font-bold ml-2 sm:ml-3">&#125;</span>
      </a>
      <div class="flex space-x-6 sm:space-x-8">
        <a routerLink="/projects" class="text-sm sm:text-base text-teal-400 hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Projects</a>
        <a href="https://medium.com/@alex1kariuki" target="_blank" rel="noopener noreferrer" class="text-sm sm:text-base text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Blog</a>
        <a routerLink="/contact" class="text-sm sm:text-base text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    <h1 class="text-3xl sm:text-4xl font-light text-center mb-6 tracking-wide leading-tight font-display">
      Projects
    </h1>

    <!-- Category Tabs -->
    <div class="flex flex-wrap justify-center gap-2 sm:gap-4 mb-10">
      <button
        *ngFor="let cat of categories"
        type="button"
        (click)="filterProjects(cat)"
        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-300 hover:bg-teal-500/30 hover:text-teal-200 category-tab"
        [ngClass]="{
          'bg-teal-500/20 text-teal-300 active': isCategorySelected(cat),
          'bg-gray-800/50 text-gray-300': !isCategorySelected(cat)
        }"
      >
        {{ cat }}
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="grid grid-cols-1 gap-16 max-w-5xl mx-auto category-fade-in">
      <div
        *ngFor="let project of projects; let i = index"
        class="bg-gray-900/50 rounded-xl overflow-hidden shadow-xl transform hover:scale-[1.02] transition-all duration-300 project-card animate-fade-in flex flex-col md:flex-row min-h-[280px]"
        [style.animation-delay]="i * 120 + 'ms'"
      >
        <!-- Project Image -->
        <div class="relative overflow-hidden group md:w-2/5">
          <img
            [src]="project.image"
            [alt]="project.title + ' preview'"
            (error)="onImageError($event)"
            loading="lazy"
            class="w-full h-80 md:h-full object-cover object-center transition-transform duration-500 group-hover:scale-110"
          />
          <div class="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-gray-900 to-transparent opacity-60"></div>

          <!-- Category Badges -->
          <div class="absolute top-4 left-4 flex flex-wrap gap-2">
            <span *ngFor="let cat of project.categories" class="px-2 py-1 text-xs rounded-md bg-black/40 backdrop-blur-sm text-white font-medium">
              {{ cat }}
            </span>
          </div>
        </div>

        <!-- Project Details -->
        <div class="p-6 md:p-10 md:w-3/5 md:flex md:flex-col md:justify-center">
          <h2 class="text-2xl font-semibold mb-4 text-teal-400">{{ project.title }}</h2>
          <p class="text-gray-300 mb-6">{{ project.description }}</p>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let tech of project.technologies" [class]="getTechBgClass(tech.color) + ' px-3 py-1 text-xs rounded-full tech-tag'">
              {{ tech.name }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="projects.length === 0" class="text-center py-16 category-fade-in">
      <p class="text-gray-400 text-lg">No projects found in this category.</p>
      <button
        type="button"
        (click)="filterProjects('All')"
        class="mt-4 px-6 py-2 bg-teal-500/20 text-teal-300 rounded-full hover:bg-teal-500/30 transition-colors duration-300"
      >
        Show All Projects
      </button>
    </div>
  </div>
</div>
