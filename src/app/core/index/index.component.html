<app-interactive-backdrop />

<div class="page-enter min-h-screen text-white relative overflow-x-hidden flex flex-col font-space-grotesk">
  <!-- Navigation -->
  <nav class="p-4 sm:p-6 lg:p-8">
    <div class="max-w-7xl mx-auto flex flex-col items-center space-y-4 sm:space-y-6">
      <a routerLink="/" class="relative flex items-center hover:opacity-80 transition-opacity duration-300" aria-label="Alex Kariuki home">
        <span class="text-2xl sm:text-3xl font-bold mr-2 sm:mr-3">&#123;</span>
        <div class="flex flex-col items-center leading-none">
          <span class="text-xl sm:text-2xl font-bold mb-1">ALEX</span>
          <span class="text-xl sm:text-2xl font-bold">KARIUKI</span>
        </div>
        <span class="text-2xl sm:text-3xl font-bold ml-2 sm:ml-3">&#125;</span>
      </a>
      <div class="flex space-x-6 sm:space-x-8">
        <a routerLink="/projects" class="text-sm sm:text-base text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Projects</a>
        <a href="https://medium.com/@alex1kariuki" target="_blank" rel="noopener noreferrer" class="text-sm sm:text-base text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Blog</a>
        <a routerLink="/contact" class="text-sm sm:text-base text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-center min-h-screen pb-8 pt-32">
    <h1 class="text-4xl sm:text-5xl md:text-7xl font-light text-center mb-16 tracking-wide leading-tight font-display mt-24 max-w-3xl mx-auto">
      Building an
      <span class="text-teal-400 inline-block transform hover:scale-105 transition-transform duration-300">amazing future</span>
      <br />
      <span class="text-white/90">in technology</span>
    </h1>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mt-8 max-w-2xl mx-auto">
      <a
        *ngFor="let cat of categories"
        [routerLink]="['/projects']"
        [queryParams]="{ category: cat.category }"
        class="transform hover:scale-105 transition-all duration-300 group cursor-pointer"
      >
        <div class="text-center p-3">
          <span class="text-lg sm:text-xl text-teal-400 group-hover:text-teal-300 transition-colors font-light">{{ cat.title }}</span>
          <p class="mt-2 text-gray-400 text-xs sm:text-sm font-light">{{ cat.description }}</p>
        </div>
      </a>
    </div>

    <!-- View All Projects Button -->
    <div class="mt-12 text-center">
      <button
        type="button"
        class="px-6 sm:px-8 py-2.5 sm:py-3 bg-teal-500 text-white font-light rounded-full hover:bg-teal-400 transform hover:translate-y-[-2px] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 focus:ring-offset-[#0a192f] text-base sm:text-lg tracking-wide flex items-center mx-auto space-x-2"
        [routerLink]="['/projects']"
      >
        <span>View Projects</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </div>

    <!-- Technology Marquee -->
    <div class="mt-16 relative overflow-hidden py-6 sm:py-8 w-full max-w-5xl mx-auto marquee-mask">
      <div class="flex w-max animate-marquee">
        <ul class="flex space-x-12 sm:space-x-16 items-center px-8 list-none m-0" aria-label="Technologies I work with">
          <li *ngFor="let tech of techLogos" class="flex items-center justify-center w-16 shrink-0">
            <img [src]="'assets/icons/tech/' + tech.icon + '.svg'" [alt]="tech.name" width="40" height="40" loading="lazy" class="h-10 w-auto filter grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
          </li>
        </ul>
        <ul class="flex space-x-12 sm:space-x-16 items-center px-8 list-none m-0" aria-hidden="true">
          <li *ngFor="let tech of techLogos" class="flex items-center justify-center w-16 shrink-0">
            <img [src]="'assets/icons/tech/' + tech.icon + '.svg'" [alt]="tech.name" width="40" height="40" loading="lazy" class="h-10 w-auto filter grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
