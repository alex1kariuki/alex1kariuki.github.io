<app-interactive-backdrop />

<div class="page-enter h-screen min-h-[640px] text-white relative overflow-hidden flex flex-col font-space-grotesk">
  <!-- Navigation -->
  <nav class="shrink-0 w-full max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 py-4 sm:py-5">
    <a routerLink="/" class="flex items-center hover:opacity-80 transition-opacity duration-300" aria-label="Alex Kariuki home">
      <span class="text-xl sm:text-2xl font-bold mr-1.5 text-teal-400">&#123;</span>
      <span class="text-base sm:text-lg font-bold tracking-wide">ALEX KARIUKI</span>
      <span class="text-xl sm:text-2xl font-bold ml-1.5 text-teal-400">&#125;</span>
    </a>
    <div class="flex space-x-5 sm:space-x-8 text-sm sm:text-base">
      <a routerLink="/projects" class="text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Projects</a>
      <a href="https://medium.com/@alex1kariuki" target="_blank" rel="noopener noreferrer" class="text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Blog</a>
      <a routerLink="/contact" class="text-white hover:text-teal-300 transition-colors hover:scale-110 transform duration-200">Contact</a>
    </div>
  </nav>

  <!-- Hero -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-4 sm:px-6 lg:px-8 min-h-0">
    <p class="text-xs sm:text-sm tracking-[0.3em] text-teal-300/80 uppercase mb-4">Software Engineer</p>

    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-light tracking-wide leading-[1.1] font-display max-w-3xl mx-auto">
      Building an
      <span class="text-teal-400 inline-block transform hover:scale-105 transition-transform duration-300">amazing future</span>
      <br />
      <span class="text-white/90">in technology</span>
    </h1>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-x-8 gap-y-4 mt-8 sm:mt-10 max-w-2xl mx-auto">
      <a
        *ngFor="let cat of categories"
        [routerLink]="['/projects']"
        [queryParams]="{ category: cat.category }"
        class="group transform hover:scale-105 transition-all duration-300 cursor-pointer"
      >
        <span class="block text-base sm:text-lg text-teal-400 group-hover:text-teal-300 transition-colors font-light">{{ cat.title }}</span>
        <span class="block mt-1 text-gray-400 text-xs font-light">{{ cat.description }}</span>
      </a>
    </div>

    <button
      type="button"
      class="mt-9 sm:mt-11 px-7 py-2.5 bg-teal-500 text-white font-light rounded-full hover:bg-teal-400 transform hover:translate-y-[-2px] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 focus:ring-offset-[#05010f] text-base tracking-wide flex items-center mx-auto space-x-2"
      [routerLink]="['/projects']"
    >
      <span>View Projects</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    </button>
  </main>

  <!-- Technology Marquee -->
  <div class="shrink-0 relative overflow-hidden py-5 sm:py-6 w-full max-w-5xl mx-auto marquee-mask">
    <div class="flex w-max animate-marquee">
      <ul class="flex space-x-10 sm:space-x-14 items-center px-6 list-none m-0" aria-label="Technologies I work with">
        <li *ngFor="let tech of techLogos" class="flex items-center justify-center w-14 shrink-0">
          <img [src]="'assets/icons/tech/' + tech.icon + '.svg'" [alt]="tech.name" width="36" height="36" loading="lazy" class="h-9 w-auto filter grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
        </li>
      </ul>
      <ul class="flex space-x-10 sm:space-x-14 items-center px-6 list-none m-0" aria-hidden="true">
        <li *ngFor="let tech of techLogos" class="flex items-center justify-center w-14 shrink-0">
          <img [src]="'assets/icons/tech/' + tech.icon + '.svg'" [alt]="tech.name" width="36" height="36" loading="lazy" class="h-9 w-auto filter grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
        </li>
      </ul>
    </div>
  </div>
</div>
