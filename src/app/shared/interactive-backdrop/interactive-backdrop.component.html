<!-- Themed deep-space background layer (colours driven by ThemeService CSS vars) -->
<div class="fixed inset-0 -z-30" aria-hidden="true">
  <div class="absolute inset-0" style="background: linear-gradient(135deg, var(--sky-1, #080418), var(--sky-2, #0d0726), var(--sky-3, #04121f));"></div>

  <!-- Nebula clouds -->
  <div class="absolute -top-[10%] left-[15%] w-[45vw] h-[45vw] rounded-full blur-[120px] animate-pulse [animation-duration:9s]" style="background: var(--nebula-1, rgba(124,58,237,0.42));"></div>
  <div class="absolute bottom-[-5%] right-[12%] w-[42vw] h-[42vw] rounded-full blur-[120px] animate-pulse [animation-duration:11s] [animation-delay:1500ms]" style="background: var(--nebula-2, rgba(219,39,119,0.30));"></div>
  <div class="absolute top-1/4 right-[-8%] w-[38vw] h-[38vw] rounded-full blur-[110px] animate-pulse [animation-duration:8s] [animation-delay:800ms]" style="background: var(--nebula-3, rgba(79,70,229,0.36));"></div>
  <div class="absolute bottom-1/4 left-[-8%] w-[34vw] h-[34vw] rounded-full blur-[110px] animate-pulse [animation-duration:10s] [animation-delay:2200ms]" style="background: var(--nebula-4, rgba(20,184,166,0.24));"></div>

  <!-- Central glow -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_50%_40%,rgba(129,140,248,0.14),transparent_55%)]"></div>

  <!-- Starfield / weather canvas -->
  <div class="particles-container absolute inset-0" #particlesContainer></div>
</div>

<!-- Noise overlay -->

  <div
    class="absolute inset-0"
    style="
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJhIiB4PSIwIiB5PSIwIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc1IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjMwMCIgaGVpZ2h0PSIzMDAiIGZpbHRlcj0idXJsKCNhKSIgb3BhY2l0eT0iMC4xNSIvPjwvc3ZnPg==');
    "
  ></div>
</div>

<!-- Occasional orbiting body (rocket / ball / snowflake per theme; drifts behind content) -->
<div #ship class="orbit-ship fixed left-0 top-0 -z-10 pointer-events-none flex items-center justify-center" style="width: 64px; height: 40px;" aria-hidden="true">
  <!-- Rocket (intergalactic) -->
  @if (orbiter === 'rocket') {
  <svg width="62" height="30" viewBox="0 0 64 30" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="shipFlame" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0" stop-color="#f8fafc" />
        <stop offset="0.35" stop-color="#38bdf8" />
        <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="shipBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#cbd5e1" />
        <stop offset="1" stop-color="#f8fafc" />
      </linearGradient>
    </defs>
    <path class="ship-flame" d="M15 15 L1 11 L5 15 L1 19 Z" fill="url(#shipFlame)" />
    <path d="M18 9 L9 2 L23 8 Z" fill="#5eead4" />
    <path d="M18 21 L9 28 L23 22 Z" fill="#5eead4" />
    <path d="M14 9 C30 6 46 8 60 15 C46 22 30 24 14 21 C10 18 10 12 14 9 Z" fill="url(#shipBody)" />
    <path d="M48 11 C53 12 57 13.4 60 15 C57 16.6 53 18 48 19 Z" fill="#2dd4bf" />
    <circle cx="30" cy="15" r="3.2" fill="#0ea5e9" />
    <circle cx="30" cy="15" r="1.4" fill="#e0f2fe" />
  </svg>
  }

  <!-- Soccer ball (World Cup) -->
  @if (orbiter === 'ball') {
  <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
    <path d="M20 9 L27 14 L24.5 22 H15.5 L13 14 Z" fill="#0f172a" />
    <path d="M20 9 L13 14 M20 9 L27 14 M13 14 L7.5 17 M27 14 L32.5 17 M15.5 22 L11 29 M24.5 22 L29 29 M15.5 22 L13 14 M24.5 22 L27 14" stroke="#0f172a" stroke-width="1.4" />
    <path d="M11 29 L20 32 L29 29" stroke="#0f172a" stroke-width="1.4" />
  </svg>
  }

  <!-- Snowflake (winter) -->
  @if (orbiter === 'snowflake') {
  <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round">
    <g>
      <path d="M20 4 V36 M6 12 L34 28 M34 12 L6 28" />
      <path d="M20 4 L16 9 M20 4 L24 9 M20 36 L16 31 M20 36 L24 31" />
      <path d="M6 12 L6.5 18 M6 12 L12 12 M34 28 L33.5 22 M34 28 L28 28" />
      <path d="M34 12 L28 12 M34 12 L33.5 18 M6 28 L12 28 M6 28 L6.5 22" />
    </g>
  </svg>
  }
</div>

<!-- Cursor-following aura (desktop only) -->
<div class="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true">
  <div
    #glow
    class="absolute h-[30vh] aspect-square bg-gradient-to-r from-violet-500/30 via-indigo-500/30 to-teal-500/30 rounded-full filter blur-[45px] transition-all duration-1000 ease-out"
  ></div>
  <div
    #secondaryGlow
    class="absolute h-[25vh] aspect-square bg-gradient-to-r from-fuchsia-400/40 via-violet-400/40 to-teal-400/40 rounded-full filter blur-[30px] transition-all duration-700 ease-out"
  ></div>
  <div
    #coreGlow
    class="absolute h-[18vh] aspect-square bg-gradient-to-r from-violet-300/50 via-indigo-300/50 to-teal-300/50 rounded-full filter blur-[20px] transition-all duration-500 ease-out"
  ></div>
</div>

<!-- Custom cursor (desktop only, hidden until first move) -->
<div #cursor class="cursor-dot fixed top-0 left-0 pointer-events-none z-[60]" aria-hidden="true">
  <div class="relative">
    <div class="absolute w-6 h-6 bg-white rounded-full blur-md"></div>
    <div class="w-4 h-4 bg-white rounded-full"></div>
  </div>
</div>

<div #trail class="cursor-trail fixed top-0 left-0 pointer-events-none z-[55]" aria-hidden="true">
  <div class="trail-inner w-12 h-12 bg-white/25 rounded-full blur-2xl transition-transform duration-500"></div>
</div>
