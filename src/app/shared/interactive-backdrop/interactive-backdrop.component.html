<!-- Ambient background layer -->
<div class="backdrop-enter fixed inset-0 -z-30" aria-hidden="true">
  <div class="absolute inset-0 bg-gradient-to-br from-[#0a192f] via-[#0a192f] to-[#112240] opacity-95"></div>
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:50px_50px]"
  ></div>
  <div
    class="absolute top-1/4 left-1/4 w-[35vw] h-[35vw] rounded-full bg-blue-500/10 blur-[150px] animate-pulse [animation-duration:5s]"
  ></div>
  <div
    class="absolute bottom-1/4 right-1/4 w-[30vw] h-[30vw] rounded-full bg-purple-500/10 blur-[150px] animate-pulse [animation-duration:6s] [animation-delay:1000ms]"
  ></div>
  <div
    class="absolute top-1/2 right-1/3 w-[25vw] h-[25vw] rounded-full bg-teal-500/10 blur-[150px] animate-pulse [animation-duration:7s] [animation-delay:2000ms]"
  ></div>
  <div class="particles-container absolute inset-0" #particlesContainer></div>
</div>

<!-- Noise overlay -->
<div class="fixed inset-0 -z-20 opacity-[0.05] mix-blend-soft-light" aria-hidden="true">
  <div
    class="absolute inset-0"
    style="
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJhIiB4PSIwIiB5PSIwIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc1IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjMwMCIgaGVpZ2h0PSIzMDAiIGZpbHRlcj0idXJsKCNhKSIgb3BhY2l0eT0iMC4xNSIvPjwvc3ZnPg==');
    "
  ></div>
</div>

<!-- Cursor-following glow (desktop only) -->
<div class="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true">
  <div
    #glow
    class="absolute h-[30vh] aspect-square bg-gradient-to-r from-purple-500/30 via-blue-500/30 to-teal-500/30 rounded-full filter blur-[40px] transition-all duration-1000 ease-out"
  ></div>
  <div
    #secondaryGlow
    class="absolute h-[25vh] aspect-square bg-gradient-to-r from-purple-400/40 via-blue-400/40 to-teal-400/40 rounded-full filter blur-[30px] transition-all duration-700 ease-out"
  ></div>
  <div
    #coreGlow
    class="absolute h-[20vh] aspect-square bg-gradient-to-r from-purple-300/50 via-blue-300/50 to-teal-300/50 rounded-full filter blur-[20px] transition-all duration-500 ease-out"
  ></div>
</div>

<!-- Custom cursor (desktop only, hidden until first move) -->
<div #cursor class="cursor-dot fixed top-0 left-0 pointer-events-none z-[60]" aria-hidden="true">
  <div class="relative">
    <div class="absolute w-6 h-6 bg-white rounded-full blur-md"></div>
    <div class="w-4 h-4 bg-white rounded-full"></div>
  </div>
</div>

<div #trail class="cursor-trail fixed top-0 left-0 pointer-events-none z-[55]" aria-hidden="true">
  <div class="trail-inner w-12 h-12 bg-white/40 rounded-full blur-2xl transition-transform duration-500"></div>
</div>
